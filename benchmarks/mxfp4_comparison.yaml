# Apples-to-apples comparison: our kernel vs TensileLite MXFP4
#
# Runs both our custom kernel and TensileLite-generated kernels
# through the same benchmark framework (Tensile.sh) on identical
# problem sizes with identical timing methodology.
#
# Usage:
#   1. Generate our custom kernel .s file:
#        cd /home/kerrwang/repos/rocm-libraries/kernel-generator
#        PYTHONPATH=shared python3 -c "
#        from kernel_generator.gemm.export_tensilelite import generate_custom_kernel
#        with open('benchmarks/Custom_Cijk_Alik_Bljk_F4BS_MXA32_MXB32_MT256x256x256_MI16x16x1_kgen_gfx950.s', 'w') as f:
#            f.write(generate_custom_kernel(256, 256, 256, dtype='mxfp4'))
#        "
#   2. Copy .s to CustomKernels:
#        cp benchmarks/Custom_*.s projects/hipblaslt/tensilelite/Tensile/CustomKernels/
#   3. Run:
#        HIP_VISIBLE_DEVICES=6 /path/to/Tensile.sh benchmarks/mxfp4_comparison.yaml /tmp/tensile_out

TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250]

GlobalParameters:
  NumElementsToValidate: -1
  MinimumRequiredVersion: 5.0.0
  PrintLevel: 3
  Device: 0
  CMakeBuildType: Release
  MergeFiles: False
  KernelTime: True
  MaxWorkspaceSize: 13421772800
  DataInitTypeA: 3
  DataInitTypeB: 3
  DataInitTypeC: 0
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 0
  DataInitTypeMXSA: 3
  DataInitTypeMXSB: 3
  MXScaleFormat: 1
  BoundsCheck: 0
  KeepBuildTmp: True
  DeviceLDS: 163840
  MaxLDS: 163840
  PrintSolutionRejectionReason: True
  CpuThreads: 1
  RotatingBufferSize: 0
  CSVExportWinner: 1

BenchmarkProblems:
  ########################################
  # MXFP4 TN: Our kernel vs TensileLite
  ########################################
  -
    - # ProblemType
      OperationType: GEMM
      DataType: F4
      DestDataType: b
      ComputeDataType: s
      HighPrecisionAccumulate: True
      MXBlockA: 32
      MXBlockB: 32
      TransposeA: 1
      TransposeB: 0
      UseBeta: True
      Batched: True
      ActivationFuncCall: True

    - InitialSolutionParameters:
      BenchmarkCommonParameters:
        - KernelLanguage: ["Assembly"]
      # TensileLite-generated kernels (same tile size as ours)
      ForkParameters:
        - MatrixInstruction:
          - [16, 16, 128, 1,  1, 8, 8,  2, 2]  # MT 256x256
          - [16, 16, 128, 1,  1, 4, 4,  2, 2]  # MT 128x128
        - PrefetchGlobalRead: [0, 2]
        - PrefetchLocalRead: [0]
        - DepthU: [256]
        - ScheduleIterAlg: [3]
        - DirectToLds: [1]
        - StreamK: [0]
        - StaggerU: [0]
        - UseSubtileImpl: [1]
      # Our custom kernel (generated by kernel_generator)
      CustomKernels:
        - "Custom_Cijk_Alik_Bljk_F4BS_MXA32_MXB32_MT256x256x256_MI16x16x1_kgen_gfx950"
      BenchmarkJoinParameters:
      BenchmarkFinalParameters:
        - ProblemSizes:
          - Exact: [4096, 4096, 1, 4096]
          - Exact: [2048, 2048, 1, 2048]
          - Exact: [1024, 1024, 1, 4096]
          - Exact: [8192, 8192, 1, 4096]
          - Exact: [256, 256, 1, 256]
